# 로컬 개발과 장애 시나리오용입니다. 서버에서는 쓰지 않습니다(서버는 Neon, Upstash).
#
#   저장소만 띄우고 IDE나 ./gradlew 로 앱 실행:  docker compose up -d postgres redis
#   앱까지 컨테이너로:                         ./gradlew bootJar && docker compose up --build
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ads
      POSTGRES_USER: ads
      POSTGRES_PASSWORD: ads
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ads -d ads"]
      interval: 2s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ads
      DB_USERNAME: ads
      DB_PASSWORD: ads
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 5s
      start_period: 40s
      retries: 10

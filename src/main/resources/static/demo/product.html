<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상품 상세 (데모)</title>
<link rel="stylesheet" href="demo.css">
</head>
<body>
<main>
  <p><a href="/demo/index.html">← 목록으로</a></p>
  <div class="product">
    <div class="meta" id="brand"></div>
    <h1 id="name"></h1>
    <div id="price"></div>
  </div>

  <fieldset>
    <legend>이 방문은 어느 광고 덕분인가 (파라미터 체이닝)</legend>
    <div id="attribution"></div>
  </fieldset>

  <fieldset>
    <legend>퍼스트파티 신호</legend>
    <div id="signal"></div>
  </fieldset>

  <fieldset>
    <legend>구매</legend>
    <button disabled>구매하기 (3단계에서 연결)</button>
    <p class="note">3단계에서 이 버튼이 URL의 광고 토큰과 함께 구매를 보내, 광고별 매출과 ROAS를 계산합니다.
      토큰이 없으면 구매는 남지만 어느 광고 덕분인지 알 수 없습니다.</p>
  </fieldset>
</main>
<script>
/*
 * 상품 상세: 광고 클릭 뒤 도착하는 랜딩 페이지.
 * - URL의 adToken이 있으면 "어느 광고, 어느 경매에서 온 방문인지" 알 수 있습니다. 토큰은 서명만 되어 있고 암호화되지 않아
 *   누구나 내용을 읽을 수 있습니다(docs/tradeoffs.md 9).
 * - 상품을 보면 "최근 본 브랜드" 신호를 남깁니다. 다음 목록 요청에서 이 브랜드 광고의 pCTR이 2배가 됩니다(1단계 개인화).
 */
(async () => {
  const params = new URLSearchParams(location.search);
  const productId = params.get('productId');
  const adToken = params.get('adToken');
  const product = await (await fetch('/products/' + encodeURIComponent(productId))).json();
  document.getElementById('brand').textContent = product.brand;
  document.getElementById('name').textContent = product.name;
  document.getElementById('price').textContent = product.price.toLocaleString() + '원';

  const attribution = document.getElementById('attribution');
  if (adToken) {
    const payload = atob(adToken.split('.')[0].replace(/-/g, '+').replace(/_/g, '/'));
    const [impressionId, adId, userId, cpc, issuedAt] = payload.split('|');
    attribution.innerHTML = '<p>광고 유입입니다. 광고 #<b></b>, 낙찰 CPC <b></b>원, 사용자 <b></b>, 발급 <b></b></p><div class="token"></div>';
    const b = attribution.querySelectorAll('b');
    b[0].textContent = adId; b[1].textContent = cpc; b[2].textContent = userId;
    b[3].textContent = new Date(Number(issuedAt)).toLocaleTimeString();
    attribution.querySelector('.token').textContent = '토큰 앞부분을 base64로 풀면: ' + payload;
  } else {
    attribution.innerHTML = '<p class="loss">광고 유입 정보가 없습니다.</p><p class="note">일반 상품을 눌렀거나, 클릭 뒤 URL에서 토큰이 빠졌습니다(파라미터 체이닝 단절). '
      + '이 상태에서 구매하면 매출은 생기지만 어느 광고 덕분인지 알 수 없어 그 광고의 ROAS가 실제보다 낮게 잡힙니다.</p>';
  }

  const request = JSON.parse(localStorage.getItem('demo.request') || '{}');
  const userId = request.userId || 'demo-user';
  await fetch('/signals/viewed-brand?userId=' + encodeURIComponent(userId) + '&brand=' + encodeURIComponent(product.brand), { method: 'POST' });
  document.getElementById('signal').textContent = userId + '이(가) ' + product.brand + ' 상품을 봤다는 신호를 남겼습니다. '
    + '목록으로 돌아가 개인화를 켠 채 새로 받으면 ' + product.brand + ' 광고의 pCTR이 2배로 계산됩니다.';
})();
</script>
</body>
</html>

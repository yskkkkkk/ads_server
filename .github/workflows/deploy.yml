# PR: 테스트만 돌립니다.
# main 머지(또는 수동 실행): 테스트 → 이미지 push → 서버 배포 → 헬스체크 → 왕복 시간 로그 출력.
# 구조는 PAM의 deploy-backend.yml을 따르고, 이름만 전부 새로 지었습니다(docs/pam-infra.md 5-2).
name: Test and Deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ads-server

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ads
          POSTGRES_USER: ads
          POSTGRES_PASSWORD: ads
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ads -d ads"
          --health-interval 2s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build jar
        run: ./gradlew test bootJar --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: build/libs/ads-server.jar
          retention-days: 1

  build-and-push:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: build/libs

      # 서버 CPU 아키텍처가 확인되지 않아(docs/pam-infra.md 5-3) amd64, arm64 둘 다 만듭니다.
      # Dockerfile에 RUN이 없어 arm64 쪽도 에뮬레이션 비용이 거의 없습니다.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    if: github.event_name != 'pull_request'
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_REF
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE_REF"

            # PAM 컨테이너가 아직 떠 있으면 8080이 겹칩니다. 멈추지 않고 실패로 알립니다(docs/pam-infra.md 5-1).
            if [ -n "$(docker ps -q -f name=^pam-backend$)" ]; then
              echo "pam-backend 컨테이너가 아직 실행 중입니다. 먼저 내려주세요."
              exit 1
            fi

            docker stop ads-server 2>/dev/null || true
            docker rm ads-server 2>/dev/null || true
            docker run -d \
              --name ads-server \
              --restart unless-stopped \
              --env-file ~/ads.env \
              -p 8080:8080 \
              "$IMAGE_REF"

            # 헬스체크(DB, Redis 연결 포함)가 UP이 될 때까지 최대 2분 기다립니다. 실패하면 배포도 실패입니다.
            for i in $(seq 1 40); do
              if curl -fs http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
                echo "health: UP"
                break
              fi
              sleep 3
            done
            if ! curl -fs http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "health check failed"
              docker logs --tail 100 ads-server
              exit 1
            fi

            # 서버 ↔ Neon, Upstash 왕복 시간(LatencyProbe)과 기동 직후 메모리
            sleep 5
            docker logs ads-server 2>&1 | grep '\[latency\]' || true
            docker stats --no-stream --format 'memory: {{.MemUsage}}' ads-server
            uname -m
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_REF: ${{ env.IMAGE }}:${{ github.sha }}
